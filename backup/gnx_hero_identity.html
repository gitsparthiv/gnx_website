
<style>
*{box-sizing:border-box;margin:0;padding:0}
.page{background:#08080f;border-radius:12px;overflow:hidden;font-family:var(--font-sans);color:#fff}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,80,30,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,80,30,0.04) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);pointer-events:none;z-index:0}

.nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;position:relative;z-index:10;border-bottom:0.5px solid rgba(255,255,255,0.05)}
.nav-brand{font-size:18px;font-weight:500;letter-spacing:5px;color:#ff5a20}
.nav-links{display:flex;gap:1.5rem}
.nav-links a{font-size:11px;color:rgba(255,255,255,0.4);text-decoration:none;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:color 0.2s}
.nav-links a:hover{color:#ff5a20}
.nav-cta{background:#ff5a20;color:#fff;font-size:11px;font-weight:500;padding:8px 18px;border-radius:20px;cursor:pointer;letter-spacing:0.5px;border:none}

.hero{position:relative;padding:4rem 2rem 3.5rem;text-align:center;display:flex;flex-direction:column;align-items:center}

.glitch-wrap{position:relative;display:inline-block;margin-bottom:1.25rem;cursor:default;user-select:none;line-height:1}
.g-main{font-size:108px;font-weight:500;letter-spacing:16px;line-height:1;background:linear-gradient(105deg,#ffffff 0%,#ffe0cc 18%,#ff8c42 38%,#ff5a20 54%,#e63e00 70%,#ff9a3c 85%,#ffd580 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;position:relative;z-index:2;font-family:var(--font-sans)}
.g-layer{position:absolute;top:0;left:0;font-size:108px;font-weight:500;letter-spacing:16px;line-height:1;font-family:var(--font-sans);pointer-events:none;z-index:1;width:100%;opacity:0}
.gl-r{color:#ff2050}.gl-c{color:#00e5ff}.gl-y{color:#ffe066}
.nbar{position:absolute;left:0;height:2px;opacity:0;z-index:5;pointer-events:none}

.identity-line{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:1.75rem}
.id-pill{display:inline-block;background:rgba(255,90,32,0.08);border:0.5px solid rgba(255,90,32,0.25);color:#ff7a40;font-size:10px;padding:4px 12px;border-radius:20px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.id-dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,0.2)}
.id-text{font-size:12px;color:rgba(255,255,255,0.35);letter-spacing:0.5px}

.about-line{font-size:14px;color:rgba(255,255,255,0.5);max-width:440px;line-height:1.7;margin-bottom:0.5rem}
.about-line span{color:rgba(255,255,255,0.85)}

.typewriter-wrap{font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:2.75rem;min-height:18px}
.cursor{display:inline-block;width:2px;height:11px;background:#ff5a20;margin-left:2px;vertical-align:middle;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.cd-label{font-size:10px;color:#ff5a20;letter-spacing:3px;text-transform:uppercase;margin-bottom:0.75rem}
.countdown{display:flex;justify-content:center;gap:10px;margin-bottom:2rem}
.cd-box{border:0.5px solid rgba(255,90,32,0.3);border-radius:8px;min-width:68px;text-align:center;position:relative;overflow:hidden}
.cd-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:rgba(255,90,32,0.35)}
.flip-num{font-size:28px;font-weight:500;color:#ff5a20;font-family:monospace;line-height:1;padding:12px 16px 4px;display:block;transition:transform 0.15s,opacity 0.15s}
.flip-num.flip{transform:translateY(-5px);opacity:0}
.cd-unit{font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:1.5px;text-transform:uppercase;padding-bottom:10px;display:block}

.btn-row{display:flex;justify-content:center;gap:12px}
.btn-p{background:#ff5a20;color:#fff;font-size:12px;font-weight:500;padding:11px 26px;border-radius:6px;cursor:pointer;border:none;letter-spacing:0.5px;transition:opacity 0.2s}
.btn-p:hover{opacity:0.85}
.btn-o{background:transparent;color:rgba(255,255,255,0.6);font-size:12px;font-weight:500;padding:11px 26px;border-radius:6px;cursor:pointer;border:0.5px solid rgba(255,255,255,0.12);letter-spacing:0.5px;transition:border-color 0.2s,color 0.2s}
.btn-o:hover{border-color:rgba(255,90,32,0.4);color:#ff7a40}

.stats-bar{display:flex;justify-content:center;border-top:0.5px solid rgba(255,255,255,0.06)}
.stat-item{flex:1;text-align:center;padding:1.25rem 1rem;border-right:0.5px solid rgba(255,255,255,0.05)}
.stat-item:last-child{border-right:none}
.stat-num{font-size:22px;font-weight:500;color:#fff}
.stat-suffix{color:#ff5a20}
.stat-label{font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:1px;text-transform:uppercase;margin-top:3px}
</style>

<div class="page">
  <nav class="nav">
    <div class="nav-brand">GNX</div>
    <div class="nav-links">
      <a>Home</a><a>About</a><a>Events</a><a>Gallery</a><a>Team</a><a>Feedback</a>
    </div>
    <button class="nav-cta">Register Now</button>
  </nav>

  <div class="hero">
    <div class="grid-bg"></div>
    <div class="scanlines"></div>

    <div class="glitch-wrap" id="gc">
      <div class="g-main" id="gm">GNX</div>
      <div class="g-layer gl-r" id="lr">GNX</div>
      <div class="g-layer gl-c" id="lc">GNX</div>
      <div class="g-layer gl-y" id="ly">GNX</div>
      <div class="nbar" id="b1"></div>
      <div class="nbar" id="b2"></div>
      <div class="nbar" id="b3"></div>
      <div class="nbar" id="b4"></div>
    </div>

    <div class="identity-line">
      <div class="id-pill">GNU / Linux Group</div>
      <div class="id-dot"></div>
      <div class="id-text">Netaji Subhash Engineering College</div>
    </div>

    <p class="about-line">A community of <span>open source minds</span> — building, breaking, and learning together.</p>

    <div class="typewriter-wrap"><span id="tw"></span><span class="cursor"></span></div>

    <div class="cd-label">Next hackathon in</div>
    <div class="countdown">
      <div class="cd-box"><span class="flip-num" id="cd-d">25</span><span class="cd-unit">Days</span></div>
      <div class="cd-box"><span class="flip-num" id="cd-h">08</span><span class="cd-unit">Hours</span></div>
      <div class="cd-box"><span class="flip-num" id="cd-m">31</span><span class="cd-unit">Mins</span></div>
      <div class="cd-box"><span class="flip-num" id="cd-s">18</span><span class="cd-unit">Secs</span></div>
    </div>

    <div class="btn-row">
      <button class="btn-p">Register for event</button>
      <button class="btn-o">View past projects</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-item"><div class="stat-num"><span class="stat-val" data-target="500">0</span><span class="stat-suffix">+</span></div><div class="stat-label">Members</div></div>
    <div class="stat-item"><div class="stat-num"><span class="stat-val" data-target="12">0</span></div><div class="stat-label">Events hosted</div></div>
    <div class="stat-item"><div class="stat-num"><span class="stat-val" data-target="3">0</span></div><div class="stat-label">Years running</div></div>
    <div class="stat-item"><div class="stat-num">&#x20B9;<span class="stat-val" data-target="2">0</span><span class="stat-suffix">L+</span></div><div class="stat-label">Prize pool</div></div>
  </div>
</div>

<script>
const target = new Date();
target.setDate(target.getDate()+25);
target.setHours(target.getHours()+8);
target.setMinutes(target.getMinutes()+31);
target.setSeconds(target.getSeconds()+18);

const els={d:document.getElementById('cd-d'),h:document.getElementById('cd-h'),m:document.getElementById('cd-m'),s:document.getElementById('cd-s')};
function flipUpdate(el,val){
  const v=String(val).padStart(2,'0');
  if(el.textContent===v)return;
  el.classList.add('flip');
  setTimeout(()=>{el.textContent=v;el.classList.remove('flip');},150);
}
function tick(){
  const diff=target-new Date();
  if(diff<=0)return;
  flipUpdate(els.d,Math.floor(diff/86400000));
  flipUpdate(els.h,Math.floor((diff%86400000)/3600000));
  flipUpdate(els.m,Math.floor((diff%3600000)/60000));
  flipUpdate(els.s,Math.floor((diff%60000)/1000));
}
setInterval(tick,1000);tick();

const phrases=['Built by students','Driven by code','Open source · Always','Made with chai & commits'];
let pi=0,ci=0,deleting=false;
const tw=document.getElementById('tw');
function typeStep(){
  const phrase=phrases[pi];
  if(!deleting){
    tw.textContent=phrase.slice(0,ci+1);ci++;
    if(ci===phrase.length){deleting=true;setTimeout(typeStep,1800);return;}
    setTimeout(typeStep,60+Math.random()*40);
  } else {
    tw.textContent=phrase.slice(0,ci-1);ci--;
    if(ci===0){deleting=false;pi=(pi+1)%phrases.length;setTimeout(typeStep,400);return;}
    setTimeout(typeStep,35);
  }
}
typeStep();

document.querySelectorAll('.stat-val').forEach(el=>{
  const t=parseInt(el.dataset.target),dur=1500,start=performance.now();
  function step(now){
    const p=Math.min((now-start)/dur,1),ease=1-Math.pow(1-p,3);
    el.textContent=Math.round(ease*t);
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
});

const gm=document.getElementById('gm'),lr=document.getElementById('lr'),lc=document.getElementById('lc'),ly=document.getElementById('ly');
const bars=['b1','b2','b3','b4'].map(id=>document.getElementById(id));
const gc=document.getElementById('gc');
function rand(a,b){return a+Math.random()*(b-a)}
function flashBar(bar,h){
  bar.style.top=rand(0,h)+'px';bar.style.width=rand(20,90)+'%';bar.style.left=rand(0,20)+'%';
  bar.style.height=rand(1,5)+'px';bar.style.background=Math.random()>0.4?'#ff6a2f':'#fff';
  bar.style.opacity=rand(0.5,1);setTimeout(()=>{bar.style.opacity=0;},rand(40,100));
}
function setL(el,dx,dy,clip,op){el.style.transform=`translate(${dx}px,${dy}px)`;el.style.clipPath=clip;el.style.opacity=op}
function resetAll(){
  gm.style.transform='translate(0,0)';gm.style.filter='none';
  [lr,lc,ly].forEach(l=>{l.style.opacity=0;l.style.transform='translate(0,0)';l.style.clipPath='none';});
  bars.forEach(b=>{b.style.opacity=0;});
}
let glitching=false;
function doGlitch(){
  if(glitching)return;glitching=true;
  const h=gc.offsetHeight||100,frames=8+Math.floor(Math.random()*6);let f=0;
  function nf(){
    if(f>=frames){resetAll();glitching=false;setTimeout(doGlitch,rand(3500,6500));return;}
    const t=f/frames,intensity=Math.sin(t*Math.PI),ms=10*intensity;
    gm.style.transform=`translate(${rand(-ms,ms)}px,${rand(-2,2)}px)`;
    gm.style.filter=Math.random()>0.7?`blur(${rand(0.5,2)}px)`:'none';
    const sl=[`inset(${rand(0,20)}% 0 ${rand(40,80)}% 0)`,`inset(${rand(30,60)}% 0 ${rand(10,35)}% 0)`,`inset(${rand(60,80)}% 0 ${rand(5,15)}% 0)`,`inset(${rand(10,40)}% 0 ${rand(20,50)}% 0)`];
    setL(lr,rand(-ms,0),rand(-2,2),sl[f%4],rand(0.5,0.85)*intensity);
    setL(lc,rand(0,ms),rand(-2,2),sl[(f+1)%4],rand(0.4,0.8)*intensity);
    setL(ly,rand(-ms/2,ms/2),rand(-1,1),sl[(f+2)%4],rand(0.3,0.6)*intensity);
    if(Math.random()>0.3){const n=Math.floor(rand(1,5));for(let i=0;i<n;i++)flashBar(bars[i],h);}
    f++;setTimeout(nf,rand(30,80));
  }
  nf();
}
setTimeout(doGlitch,1800);
gc.addEventListener('mouseenter',()=>{if(!glitching)doGlitch();});
</script>
